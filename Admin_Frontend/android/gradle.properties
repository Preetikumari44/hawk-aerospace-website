# Project-wide Gradle settings.

# 🚀 MEMORY OPTIMIZATION: Increased heap from 2048m to 4096m to prevent memory stalls during C++ compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# ⚡ BUILD SPEED FLAGS: Enable daemon caching and parallel core processing
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
android.enableDexingArtifactTransform=true

# AndroidX package structure configuration
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
# 🛠️ LOCAL ARCHITECTURE RESTRICTION: Changed from building 4 architectures to just 1 (arm64-v8a)
# Temporarily build only one architecture to reduce path length issues and prevent heavy C++ compilation
reactNativeArchitectures=arm64-v8a

# Use this property to enable support to the new architecture.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false

# Enable Gradle build cache to improve build performance
org.gradle.caching=true
