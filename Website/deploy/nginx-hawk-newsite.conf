# Hawk booking site (Next.js SSR) — http://<ec2-ip>:8083
#
# Reverse-proxies to the PM2-managed `next start` on 127.0.0.1:3002
# (process name: hawk-newsite). This app CANNOT be served as static files:
# it has API routes (/api/auth/otp/*, /api/skymap/*) and middleware.ts,
# so it must run under `next start`.
#
# INSTALL (handled automatically by deploy-site.ps1 / deploy.yml):
#   sudo cp nginx-hawk-newsite.conf /etc/nginx/sites-available/hawk-newsite
#   sudo ln -sf /etc/nginx/sites-available/hawk-newsite /etc/nginx/sites-enabled/hawk-newsite
#   sudo nginx -t && sudo systemctl reload nginx
#
# Port map (do NOT reuse): 3000 backend · 3001 360-backend · 3002 this site
# (internal) · 8081 user site · 8082 360 frontend · 8083 this site (public).

server {
    listen 8083;
    listen [::]:8083;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Next.js SSR responses + builds can be slow on small instances.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
