# All environment-specific values and every secret come from environment variables (see .env.example).
# There are intentionally NO defaults for database credentials, SMTP credentials or the admin password.
spring:
  application:
    name: distributor-dealer-backend
  config:
    # Optional local convenience: values in ./.env (KEY=value, no quotes) are read when the app is started from this
    # folder, so no shell scripting is needed on Windows. Real environment variables always win. Not used in production.
    import: optional:file:./.env[.properties]
  datasource:
    # MySQL 8.x via Connector/J, e.g. jdbc:mysql://localhost:3306/hawk_distributor?connectionTimeZone=UTC
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway; Hibernate only verifies it
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB         # must match app.upload.max-bytes and the frontend FILE_RULES
      max-request-size: 11MB
      file-size-threshold: 1MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:false}   # true for implicit TLS (port 465); then disable STARTTLS
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000

server:
  port: ${SERVER_PORT:8080}
  # Set to "framework" (or "native") only when running behind a trusted reverse proxy, so the rate limiter
  # sees the real client IP from X-Forwarded-For. Leave "none" otherwise (the header is client-controlled).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false              # an SMTP outage must not mark the whole service DOWN

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  cors:
    # Exact origin(s) of the Next.js frontend, comma separated. "*" is rejected at startup.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    # Absolute directory OUTSIDE any web root. Created on startup if missing.
    root: ${STORAGE_ROOT}
  upload:
    max-bytes: 10485760
  mail:
    from: ${MAIL_FROM}
    admin-to: ${ADMIN_NOTIFICATION_EMAIL}
    attach-document: ${MAIL_ATTACH_DOCUMENT:true}
  notification:
    retry-enabled: ${NOTIFICATION_RETRY_ENABLED:true}
    retry-interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:300000}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:5}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:600}
  duplicate-window-seconds: ${DUPLICATE_WINDOW_SECONDS:600}
  admin:
    username: ${ADMIN_USERNAME:admin}
    # "{bcrypt}$2a$10$..." hash. Empty = admin API disabled (every /api/admin/** call is rejected).
    password-hash: ${ADMIN_PASSWORD_HASH:}
