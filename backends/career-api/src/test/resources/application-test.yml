spring:
  datasource:
    url: jdbc:h2:mem:career-${random.uuid};MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 1025
app:
  mail:
    from: careers@test.invalid
    admin-to: admin@test.invalid
  notification:
    retry-initial-delay: PT24H
    retry-interval: PT24H
