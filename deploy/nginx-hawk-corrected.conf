# Hawk-AeroSpace-Corrected frontend — hawkaerosystem.com (instance2 only)
#
# Reverse-proxies to the docker-compose `frontend` (Next.js SSR, `npm start`)
# on 127.0.0.1:${FRONTEND_HOST_PORT:-3000}. This app CANNOT be static:
# API routes (/api/contact, /api/career/applications, /api/distributor/applications,
# /api/auth/*, /api/skymap/*) + middleware.ts require SSR.
#
# INSTALL (automatic via server-setup-corrected.sh):
#   sudo cp nginx-hawk-corrected.conf /etc/nginx/sites-available/hawk-corrected
#   sudo ln -sf /etc/nginx/sites-available/hawk-corrected /etc/nginx/sites-enabled/hawk-corrected
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (required for Razorpay live + Firebase on the domain):
#   sudo certbot --nginx -d hawkaerosystem.com -d www.hawkaerosystem.com
#
# Port map (instance2 — do NOT reuse instance1 ports here):
#   3000 -> frontend internal (127.0.0.1 only, never public)
#   3307 -> mysql (127.0.0.1 only) · 8081/8082/8083 -> Java APIs (127.0.0.1 only)
#   80/443 -> public via this file. Instance1 (backend+admin+website) untouched.

server {
    listen 80;
    listen [::]:80;
    server_name hawkaerosystem.com www.hawkaerosystem.com;

    # ACME challenge for certbot (must stay on :80 even after HTTPS enabled)
    # USER_API (prod Nest copy on THIS box :3001, hawk-prod EMPTY DB) via same
    # origin — browser calls https://hawkaerosystem.com/api/*, nginx proxies to
    # localhost:3001. No CORS. Instance1 backend (43.205.190.95:3000, test DB)
    # stays untouched for Website/Admin-test. Admin app sees BOTH via its
    # Test/Prod switcher (Admin_Frontend src/api/client.ts + BackendSwitcher).
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Redirect to HTTPS once certbot has issued a cert. Comment out until then.
        # return 301 https://$host$request_uri;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
